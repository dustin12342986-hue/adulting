<!-- PWA install support: manifest + icons + theme color. Same minimal
     pattern used across this app ecosystem so install behavior and
     branding stay consistent app to app. -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#ff8b6b">
<link rel="stylesheet" href="css/style.css?v=20260816g" />
</head>
<body>
<div id="demoBanner" style="display:none"></div>
<div id="appShell">
  <header class="hero-banner" id="heroBanner"><!-- rendered by app.js: sunset/beach illustration --></header>
  <div id="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main id="main"><!-- rendered by app.js --></main>
  </div>
</div>

<div id="boardRoot" style="display:none"><!-- standalone status-light board view --></div>
<div id="onboardingRoot"><!-- first-run welcome / Google connect --></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="praiseRoot"></div>

<!--
  Cache-busting: GitHub Pages serves these files with ~10 minutes of cache,
  and a normal page reload does NOT re-fetch already-cached sub-resources
  like these scripts even if the page itself loads fresh — only a hard
  refresh does. That caused real, confusing bugs this session where a newly
  uploaded fix was live on GitHub but browsers kept running the old script
  for up to 10 minutes (or longer, if not hard-refreshed). Bump the ?v=
  number below whenever any of these files change, so browsers always treat
  an update as a brand new URL and fetch it immediately instead of reusing
  a stale cached copy.
-->
<script src="js/data.js?v=20260816g"></script>
<script src="js/state.js?v=20260816g"></script>
<script src="js/budget-engine.js?v=20260816g"></script>
<script src="js/reentry.js?v=20260816g"></script>
<script src="js/calendar.js?v=20260816g"></script>
<script src="js/drivesync.js?v=20260816g"></script>
<script src="js/app.js?v=20260816g"></script>
<script src="js/blue-bonnet-widget-organize.js?v=20260816g"></script>
</body>
</html>
